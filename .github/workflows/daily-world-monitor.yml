name: Daily World Monitor Copy

on:
  workflow_dispatch:
  schedule:
    # 12:00 Asia/Shanghai = 04:00 UTC
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate daily copy
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\daily-news.ps1 -Out output -TextOut copy-output

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: world-monitor-copy
          path: |
            output/*
            copy-output/*

      - name: Commit generated files
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output copy-output
          if (git diff --cached --quiet) {
            Write-Host "No generated changes to commit."
          } else {
            git commit -m "Generate daily World Monitor copy"
            git push
          }
